[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dallama"
version = "0.1.0"
description = "Async Python manager for a llama.cpp llama-server: safe model swaps, health watchdog, idle unload."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sakir Cimen" }]
keywords = ["llama-cpp", "llama-server", "local-llm", "gguf", "model-serving", "asyncio", "kutai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/msakirc/dallama"
Repository = "https://github.com/msakirc/dallama"
Monorepo = "https://github.com/msakirc/kutai/tree/main/packages/dallama"

[tool.setuptools.packages.find]
where = ["src"]
